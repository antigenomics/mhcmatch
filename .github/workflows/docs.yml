name: docs

on:
  push:
    branches: [dev, master]
  # Build on PRs too. Until 2026-09-20 this was push-only, so a pull request could break the
  # -W docs build and still show a green CI: the failure only appeared after merge. The deploy
  # job below is already gated on master and `concurrency` is per-ref, so a PR run can neither
  # publish nor cancel an in-flight master deploy.
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref so a dev push never cancels an in-flight master Pages deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs toolchain
        # autodoc imports mhcmatch from src/ with seqtree and heavy deps mocked
        # (docs/conf.py: autodoc_mock_imports), so the package/native deps are not needed.
        run: pip install -r docs/requirements.txt
      - name: Build HTML (fail on warnings)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      # Nothing consumes the artifact on a PR -- only the master deploy job does -- and it is the
      # one step a fork PR's read-only token could trip on. The build above is the actual gate.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    # The github-pages environment only allows deploys from the default branch; on dev we
    # validate the build (above) but skip deployment so the workflow stays green.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
