name: ci

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (pulls seqtree from PyPI; pure-Python package, no build)
        run: pip install -e ".[test]"
      - name: No shipped artifact is stale for this version
        # Builds nothing, exits 1 if any of the 27 files under src/mhcmatch/data is stamped behind
        # __version__. The pytest guards below cover the anchor models and the corpus tables only;
        # this covers every family, including the ones fitted in the benchmark repo. publish.yml
        # runs it again after a real rebuild, as the last gate before the wheel is cut.
        run: mhcmatch build --check
      - name: Run tests
        run: pytest -q
