[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mhcmatch"
version = "0.24.0"
description = "Peptide-MHC presentation, cross-reactivity and motif tools on the seqtree substrate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ISALGO laboratory", email = "mikhail.shugay@gmail.com" }]
keywords = ["MHC", "HLA", "epitope", "neoantigen", "immunology", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["seqtree>=0.7.0", "numpy", "huggingface_hub>=0.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
logo = ["logomaker", "matplotlib"]   # only needed to render logos; PWM/bits compute is numpy-only
pmhc = ["pandas"]                    # convenience IO for large tables
docs = ["sphinx", "pydata-sphinx-theme"]
viz = ["networkx"]                   # allele similarity / promiscuity graph (needs Graphviz `dot`)
structure = ["tcren>=2.8"]           # optional: structure-based MJ ΔΔG head (mhcmatch.structure)
precursor = ["vdjmatch[precursor]>=0.2.0"]  # mhcmatch.precursor re-exports vdjmatch.precursor
notebooks = ["marimo"]               # worked examples in notebooks/ (pure-Python marimo notebooks)
esm = ["torch>=2.2", "transformers>=4.40"]   # ESM2 embeddings for mhcmatch.recognition; ~2.4 GB checkpoint on first use

[project.scripts]
mhcmatch = "mhcmatch.cli:main"

[project.urls]
Homepage = "https://github.com/antigenomics/mhcmatch"
Repository = "https://github.com/antigenomics/mhcmatch"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hfdata: needs the isalgo/pmhc_data deposit (a staged mirror, a warm HF cache, or RUN_HF_FETCH=1). Deselect with -m 'not hfdata'.",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mhcmatch"]
# data/ (pseudosequence FASTAs, structural pocket TSVs) ships automatically under the package above;
# a force-include here would double-add those files and break the wheel build.

[tool.hatch.build.targets.sdist]
# `.claude/` is machine-local harness config -- absolute /Users/... paths and a permission
# allowlist -- and worktree checkouts live under it. A guard, not a fix for a leak: the published
# 0.20.0 sdist carries 0 `.claude` entries of 132, because hatchling's VCS-aware file selection
# already honours the `.claude/` gitignore rule. This keeps that true if the ignore rule ever
# moves. The wheel target above is untouched.
exclude = [".claude"]
